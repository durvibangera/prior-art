fingerprint: This invention proposes a machine learning framework for Counter Unmanned Aerial System (C-UAS)
  operations that utilizes acoustic sensors to detect and classify various types of drones. Unlike prior
  art relying on limited datasets or single handcrafted features like MFCCs, this system employs a Wavelet
  Scattering Transform (WST) to generate robust time-frequency representations. The architecture integrates
  this advanced feature extraction with a 1D CNN and LSTM for classification, addressing limitations in
  generalization across diverse flight patterns, noise conditions, and non-anechoic environments. By focusing
  on smart feature fusion and noise robustness, the method aims to provide a low-cost, passive detection
  solution capable of operating effectively under realistic acoustic interference and varying rotor speeds.
