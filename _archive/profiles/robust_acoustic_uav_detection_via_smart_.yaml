fingerprint: This invention presents a machine learning framework specifically designed for Counter Unmanned
  Aerial System (C-UAS) operations, utilizing acoustic sensors to detect and classify various unmanned
  aerial vehicles (UAVs). Unlike prior art that relies on single acoustic feature representations like
  Wavelet Scattering Transform or handcrafted features such as MFCCs, this system employs a novel smart
  acoustic feature fusion mechanism. The framework integrates multiple complementary acoustic feature
  domains to robustly capture temporal, spectral, and time-frequency characteristics of UAV sounds. This
  approach significantly enhances detection accuracy under challenging conditions, including low signal-to-noise
  ratios, reverberation, and diverse flight patterns. The system is trained on extensive, realistic audio
  datasets encompassing different terrains, lighting conditions, and UAV types, ensuring high generalization
  capability. By addressing the limitations of existing single-model approaches, the invention provides
  a low-cost, passive, and highly sensitive detection solution suitable for deployment on resource-constrained
  edge devices with minimal latency.
